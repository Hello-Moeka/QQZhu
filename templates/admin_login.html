<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if is_super_admin %}超级管理员登录{% else %}后台登录{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/glass.css">
    <link rel="stylesheet" href="/static/css/glass-admin.css">
</head>
<body class="glass-app glass-admin-app">
    <div class="glass-bg" style="--glass-bg-image: url('{{ background_url | default('/static/background.jpg') }}'); --glass-scrim-opacity: 0.55"></div>
    <div class="glass-auth">
        <section class="glass-panel glass-auth__card">
            <h1 class="glass-auth__title">{% if is_super_admin %}超级管理员登录{% else %}后台登录{% endif %}</h1>
            <form method="post" action="{{ form_action | default('/admin/login') }}">
                <input type="hidden" name="next" value="{{ next }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="token">Admin Token</label>
                <input class="glass-input" type="password" id="token" name="token" required autocomplete="current-password" aria-label="Admin Token">
                <button type="submit" class="glass-btn glass-btn-primary"><i class="fas fa-door-open"></i> 登录</button>
            </form>
            {% if message %}
            <div class="message error" style="margin-top: 12px;">{{ message }}</div>
            {% endif %}
        </section>
    </div>
    <script src="/static/js/glass-core.js"></script>
</body>
</html>
